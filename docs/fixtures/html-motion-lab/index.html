<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cinemana Motion Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c0e14;color:#f7f4f1;font:16px system-ui,sans-serif}button,select,input{font:inherit}button,select{color:inherit;background:#232733;border:1px solid #ffffff25;border-radius:12px;min-height:48px;padding:8px 12px;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #ff9d91;outline-offset:3px}button:active{transform:scale(.97)}main{max-width:560px;margin:auto;padding:18px 16px 70px}.hero{min-height:180px;border-radius:24px;background:radial-gradient(ellipse at 15% 10%,#8a485b,transparent 60%),linear-gradient(135deg,#26345b,#11131d);display:flex;flex-direction:column;justify-content:end;padding:20px}.hero h1{font-size:27px;margin:0}p,small{color:#c1c4ce}h2{font-size:19px;margin:24px 0 10px}.settings{padding:14px;border-radius:16px;background:#181b24;display:grid;gap:12px}.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}.strip{display:flex;gap:10px;overflow:auto;padding:4px 0 10px}.entry{display:grid;gap:6px;min-width:0;flex:none;touch-action:pan-x pan-y;user-select:none;-webkit-touch-callout:none}.entry .cover,.art{background:radial-gradient(circle at 25% 30%,#ebba7166,transparent 30%),linear-gradient(145deg,var(--a),var(--b));border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;text-shadow:0 1px 5px #000;overflow:hidden}.cover{width:100%;aspect-ratio:16/9;position:relative}.cover::after,.art::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,#0004);pointer-events:none}.entry{width:190px;padding:0;border:none;background:none;text-align:start}.entry .title{font-weight:650;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.progress{height:5px;border-radius:4px;background:#7777;overflow:hidden}.progress i{display:block;height:100%;width:var(--p);background:#ff897e}.strip[data-style=poster] .entry{width:105px}.strip[data-style=poster] .cover{aspect-ratio:2/3}.strip[data-style=wide] .entry{width:min(100%,340px);grid-template-columns:100px 1fr;align-items:center;padding:8px;background:#1b202a;border:1px solid #ffffff20}.strip[data-style=wide] .cover{aspect-ratio:2/3;grid-row:span 2}.strip[data-style=wide] .title{white-space:normal}.catalog .entry{width:108px}.catalog .cover{aspect-ratio:2/3}.dialog{border:0;background:transparent;color:inherit;padding:0;width:min(88vw,360px);max-height:88vh;overflow:auto;margin:auto}.dialog::backdrop{background:#090a10cc;backdrop-filter:blur(9px)}.dialog[data-glass=false]::backdrop{backdrop-filter:none}.overlay-shell{display:grid;gap:10px}.art{position:relative;width:min(100%,190px);aspect-ratio:2/3;justify-self:center;transform-origin:0 0}.overlay-shell h2{margin:0;text-align:center}.actions{padding:10px;background:#242936;border:1px solid #ffffff24;border-radius:20px;display:grid;gap:6px}.actions button{text-align:start;background:#ffffff08}.actions button:last-child{text-align:center}.sheet-mode{margin:auto auto 0;width:min(100%,560px);max-height:85vh}.sheet-mode .art{width:110px;aspect-ratio:16/9}.sheet-mode .overlay-shell{border-radius:24px 24px 0 0;background:#1c202b;padding:20px}.hidden,[hidden]{display:none!important}.more{font-size:14px;background:transparent;min-height:48px}.status{min-height:48px}.title-row{display:flex;align-items:center;justify-content:space-between}.title-row h2{margin:12px 0}.actions .danger{color:#ffaca6}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}button:active{transform:none}}
</style></head><body><main id="page"><p>CP-DL / مختبر حركة مستقل • بيانات اصطناعية</p><div class="hero"><h1>سينما تتحرك معك</h1><p>اضغط بطاقة أو اضغط مطولاً لعرض خياراتها.</p></div><section class="settings"><div class="setting"><label for="layout">متابعة المشاهدة</label><select id="layout"><option value="card">بطاقات أفقية</option><option value="wide">صف عريض</option><option value="poster">ملصقات</option></select></div><div class="setting"><label for="enabled">إظهار المتابعة</label><input id="enabled" type="checkbox" checked></div><div class="setting"><label for="motion">الحركة</label><input id="motion" type="checkbox" checked></div><div class="setting"><label for="speed">مدة الحركة</label><input id="speed" type="range" min="50" max="150" step="10" value="100"></div><div class="setting"><label for="glass">ضبابية الخلفية</label><input id="glass" type="checkbox" checked></div><button id="restore">استعادة أمثلة المشاهدة</button></section>
<section id="watch"><div class="title-row"><h2>متابعة المشاهدة</h2><button class="more" id="watch-actions">خيارات</button></div><div class="strip" id="watch-list" data-style="card"></div></section><section><h2>اكتشف</h2><div id="posters" class="strip catalog"></div></section><p id="status" class="status" aria-live="polite">كل الإجراءات محاكاة، دون ملفات أو حساب حقيقي.</p></main>
<dialog class="dialog" id="dialog" aria-labelledby="dialog-title"><div class="overlay-shell" id="shell"><div id="art" class="art" aria-hidden="true"></div><h2 id="dialog-title">خيارات</h2><div class="actions"><button id="details">التفاصيل / تشغيل تجريبي</button><button id="restart">المشاهدة من البداية (محاكاة)</button><button id="mark">تمت المشاهدة (محاكاة)</button><button id="remove" class="danger">إزالة من المتابعة (محاكاة)</button><button id="close" autofocus>إغلاق</button></div></div></dialog>
<script src="motion-model.js"></script><script>
"use strict";
const $=id=>document.getElementById(id), m=CPMotion, dialog=$("dialog"), art=$("art"), page=$("page"), shell=$("shell"), status=$("status"), data=[{id:"a",title:"رحلة إلى الضوء",a:"#8b3c5d",b:"#1b2443",p:64},{id:"b",title:"أفق بعيد",a:"#18616c",b:"#172c4e",p:38},{id:"c",title:"مدينة الصمت",a:"#977142",b:"#3f193c",p:12}], mq=matchMedia("(prefers-reduced-motion: reduce)");
let watchIds=["a","b","c"], active=null, origin=null, hold=null, swallowed=false, suppressFor=null, anims=new Set(), generation=0, closing=false;
function reduced(){return !$("motion").checked||mq.matches||document.hidden}
function dur(k){return m.duration(k,Number($("speed").value),reduced())}
function rect(el){const r=el.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}}
function stop(){generation++;for(const a of anims)a.cancel();anims.clear()}
function play(el,frames,kind){if(!dur(kind)||typeof el.animate!=="function")return Promise.resolve();const a=el.animate(frames,{duration:dur(kind),easing:"cubic-bezier(.22,.75,.24,1)",fill:"none"});anims.add(a);return a.finished.catch(()=>{}).finally(()=>anims.delete(a))}
function paint(el,item){el.style.setProperty("--a",item.a);el.style.setProperty("--b",item.b);el.textContent=item.title}
function transform(inv){return "translate("+inv.x+"px,"+inv.y+"px) scale("+inv.sx+","+inv.sy+")"}
function setStatus(s){status.textContent=s}
function clearHold(){if(hold){clearTimeout(hold.timer);hold=null}}
function makeEntry(item,watch){let b=document.createElement("button");b.type="button";b.className="entry";b.dataset.id=item.id;b.dataset.watch=String(watch);b.setAttribute("aria-label",item.title);let c=document.createElement("span");c.className="cover";paint(c,item);let title=document.createElement("span");title.className="title";title.textContent=item.title;b.append(c,title);if(watch){let progress=document.createElement("span");progress.className="progress";progress.style.setProperty("--p",item.p+"%");progress.append(document.createElement("i"));b.append(progress)}
 b.addEventListener("pointerdown",e=>{if(!e.isPrimary||e.button!==0)return;clearHold();swallowed=false;suppressFor=null;let p={x:e.clientX,y:e.clientY,id:e.pointerId,el:b,t:performance.now()};p.timer=setTimeout(()=>{if(hold!==p)return;swallowed=true;suppressFor=b;clearHold();open(item,b,watch&&$("layout").value==="wide")},460);hold=p});
 b.addEventListener("pointermove",e=>{if(hold?.id===e.pointerId&&Math.hypot(e.clientX-hold.x,e.clientY-hold.y)>12)clearHold()});
 b.addEventListener("pointerup",clearHold);b.addEventListener("pointercancel",clearHold);b.addEventListener("pointerleave",clearHold);
 b.addEventListener("contextmenu",e=>{e.preventDefault();if(!dialog.open){clearHold();swallowed=true;suppressFor=b;open(item,b,watch&&$("layout").value==="wide")}});
 b.addEventListener("click",()=>{if(swallowed&&suppressFor===b){swallowed=false;suppressFor=null;return}open(item,b,watch&&$("layout").value==="wide")});
 b.addEventListener("keydown",e=>{if(e.key==="ContextMenu"||(e.shiftKey&&e.key==="F10")){e.preventDefault();open(item,b,watch&&$("layout").value==="wide")}});return b}
function renderWatch(animate=false){const list=$("watch-list"), before=new Map([...list.children].map(e=>[e.dataset.id,rect(e)]));const byId=new Map([...list.children].map(e=>[e.dataset.id,e]));list.dataset.style=m.style($("layout").value);for(const id of watchIds){const item=data.find(x=>x.id===id),b=byId.get(id)||makeEntry(item,true);list.append(b);byId.delete(id)}byId.forEach(e=>e.remove());$("watch").hidden=!m.isVisible($("enabled").checked,watchIds.length);if(animate&&!$("watch").hidden)for(const b of list.children){const inv=m.inverse(before.get(b.dataset.id),rect(b));if(inv)play(b,[{transformOrigin:"0 0",transform:transform(inv)},{transformOrigin:"0 0",transform:"none"}],"layout")}}
function open(item,button,sheet=false){if(dialog.open||closing)return;stop();active=item;origin=button;let from=rect(button.querySelector(".cover")||button);paint(art,item);$("dialog-title").textContent=item.title;dialog.classList.toggle("sheet-mode",sheet);dialog.dataset.glass=String($("glass").checked);$("remove").hidden=!watchIds.includes(item.id);$("mark").hidden=!watchIds.includes(item.id);dialog.showModal();const inv=m.inverse(from,rect(art));if(sheet)play(shell,[{transform:"translateY(100%)",opacity:.65},{transform:"none",opacity:1}],"sheet");else if(inv){play(art,[{transform:transform(inv),opacity:.75},{transform:"none",opacity:1}],"poster");play($("dialog-title"),[{opacity:0},{opacity:1}],"sheet")}else play(shell,[{opacity:0},{opacity:1}],"sheet");$("close").focus({preventScroll:true})}
async function close(action){if(!dialog.open||closing)return;closing=true;stop();const stamp=generation;if(dialog.classList.contains("sheet-mode"))await play(shell,[{transform:"none",opacity:1},{transform:"translateY(100%)",opacity:.3}],"close");else {const target=origin?.isConnected?origin.querySelector(".cover"):null;const inv=target?m.inverse(rect(target),rect(art)):null;await play(art,inv?[{transform:"none",opacity:1},{transform:transform(inv),opacity:0}]:[{opacity:1},{opacity:0}],"close")}if(stamp!==generation){if(dialog.open)dialog.close();closing=false;return}const button=origin;dialog.close();closing=false;active=null;origin=null;if(action)action();if(button?.isConnected)button.focus({preventScroll:true});else $("restore").focus({preventScroll:true})}
function instantReset(){clearHold();stop();if(dialog.open)dialog.close();closing=false;active=null;origin=null}
$("close").onclick=()=>close();dialog.addEventListener("cancel",e=>{e.preventDefault();close()});dialog.addEventListener("click",e=>{if(e.target===dialog)close()});
$("details").onclick=()=>close(()=>setStatus("تم فتح التفاصيل التجريبية"));$("restart").onclick=()=>close(()=>setStatus("تم طلب المشاهدة من البداية (محاكاة)"));
function removeActive(){let id=active?.id;if(!id)return;close(()=>{watchIds=watchIds.filter(x=>x!==id);renderWatch(true);setStatus("أزيل العنصر من المتابعة التجريبية فقط")})}
$("remove").onclick=removeActive;$("mark").onclick=removeActive;$("restore").onclick=()=>{watchIds=data.map(x=>x.id);$("enabled").checked=true;renderWatch(true);setStatus("استعيدت الأمثلة")};
$("watch-actions").onclick=()=>{let b=$("watch-list").firstElementChild;if(b)open(data.find(x=>x.id===b.dataset.id),b,true)};
$("layout").onchange=()=>{stop();renderWatch(true)};$("enabled").onchange=()=>renderWatch();$("motion").onchange=()=>{if(!$("motion").checked)stop()};$("glass").onchange=()=>dialog.dataset.glass=String($("glass").checked);
document.addEventListener("visibilitychange",()=>{if(document.hidden)instantReset()});addEventListener("resize",()=>{clearHold();if(dialog.open)stop()});mq.addEventListener?.("change",()=>{if(mq.matches)stop()});
data.forEach(x=>$("posters").append(makeEntry(x,false)));renderWatch();
</script></body></html>
