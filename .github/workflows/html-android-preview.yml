name: CP HTML standalone Android preview
on:
  push:
    branches: [Html]
    paths: ['patches/html-preview/**', '.github/workflows/html-android-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cp-html-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.ref == 'refs/heads/Html'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0 platforms;android-35'
      - name: Build isolated signed preview and test APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CINEMANA_KEYSTORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.CINEMANA_KEY_PASSWORD || secrets.CINEMANA_KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ vars.CINEMANA_KEY_ALIAS || 'androiddebugkey' }}
        run: bash patches/html-preview/build.sh
      - name: Enable KVM for Android 15
        run: |
          if [[ -c /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
      - name: Android 15 standalone WebView smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1800
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install "$RUNNER_TEMP/cp-html-preview/main.apk"
            adb install "$RUNNER_TEMP/cp-html-preview/test.apk"
            adb shell am instrument -w com.alwansan.cinemana.htmlpreview.test/.PreviewTest | tee "$RUNNER_TEMP/cp-html-preview/android-test.txt"
            grep -F 'CP_HTML_PREVIEW_PASS' "$RUNNER_TEMP/cp-html-preview/android-test.txt"
            grep -F 'INSTRUMENTATION_CODE: -1' "$RUNNER_TEMP/cp-html-preview/android-test.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Cinemana-HTML-Preview
          path: |
            ${{ runner.temp }}/cp-html-preview/Cinemana-HTML-Preview-0.1.apk
            ${{ runner.temp }}/cp-html-preview/SHA256SUMS.txt
            ${{ runner.temp }}/cp-html-preview/android-test.txt
          if-no-files-found: error
      - name: Publish preview only after Android test
        uses: softprops/action-gh-release@v3
        with:
          tag_name: cp-html-preview-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Cinemana HTML Preview #${{ github.run_number }}
          prerelease: true
          make_latest: "false"
          body: |
            Standalone synthetic HTML UI preview, separate package. No original app data, real account, downloads or playback. Android WebView smoke test required. Install alongside the stable Cinemana app.
          files: |
            ${{ runner.temp }}/cp-html-preview/Cinemana-HTML-Preview-0.1.apk
            ${{ runner.temp }}/cp-html-preview/SHA256SUMS.txt
          fail_on_unmatched_files: true
