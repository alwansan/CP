name: CP Native Compose exact parcel namespace probe
on:
  push:
    branches: [Native-Compose]
    paths: ['patches/native-compose-parcel-isolation/**', '.github/workflows/native-compose-parcel-isolation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/Native-Compose'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0 platforms;android-35'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Relocate eight exact classes and verify standalone DEX
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CINEMANA_KEYSTORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.CINEMANA_KEY_PASSWORD || secrets.CINEMANA_KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ vars.CINEMANA_KEY_ALIAS || 'androiddebugkey' }}
        run: bash patches/native-compose-parcel-isolation/run-probe.sh
      - name: Enable KVM
        run: |
          if [[ -c /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
      - name: Android 15 relocated standalone smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1800
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 patches/native-compose-isolation/smoke-r8-runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CP-Parcel-Isolation-Diagnostics
          path: |
            ${{ runner.temp }}/cp-parcel-relocation/*.log
            ${{ runner.temp }}/cp-parcel-relocation/report
            ${{ runner.temp }}/cp-isolation-probe/*.txt
            ${{ runner.temp }}/cp-isolation-probe/*.xml
            ${{ runner.temp }}/cp-isolation-probe/report
          if-no-files-found: warn
