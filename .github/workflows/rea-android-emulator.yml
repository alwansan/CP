name: Install and launch source-first diagnostic APK on Android emulator

on:
  workflow_dispatch:
  push:
    branches: [experiment/rea-source-recovery]
    paths:
      - 'recovery/modernized/legacy-resources/**'
      - 'recovery/scripts/prepare_legacy_resources.py'
      - 'recovery/modernized/android-smoke/**'
      - '.github/workflows/rea-android-emulator.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install-and-launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable diagnostics APK with original resources
        working-directory: recovery/modernized
        run: gradle --no-daemon :android-smoke:assembleDebug --stacktrace
      - name: Allow Android hardware acceleration on Linux
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install diagnostic APK and verify actual Android activity
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash recovery/modernized/android-smoke/emulator-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-android-emulator-test-evidence
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/recovery-emulator/
