name: CP HTML native download model
on:
  push:
    branches: [Html]
    paths: ['patches/html-bridge/**', '.github/workflows/html-native-model.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    if: github.ref == 'refs/heads/Html'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile plain Java model and run assertions
        run: |
          mkdir -p "$RUNNER_TEMP/cp-html-model"
          javac --release 8 -d "$RUNNER_TEMP/cp-html-model" $(find patches/html-bridge/src patches/html-bridge/tests -name '*.java' -type f)
          java -ea -cp "$RUNNER_TEMP/cp-html-model" com.shabakaty.cinemana.htmlbridge.model.DownloadModelTest
          java -ea -cp "$RUNNER_TEMP/cp-html-model" com.shabakaty.cinemana.htmlbridge.model.BoundedDownloadReadTest
          java -ea -cp "$RUNNER_TEMP/cp-html-model" com.shabakaty.cinemana.htmlbridge.model.NativeEvidenceGateTest
          java -ea -cp "$RUNNER_TEMP/cp-html-model" com.shabakaty.cinemana.htmlbridge.model.BoundedMkvPathHintTest
          java -ea -cp "$RUNNER_TEMP/cp-html-model" com.shabakaty.cinemana.htmlbridge.model.AdmissionReceiptGateTest
          java -ea -cp "$RUNNER_TEMP/cp-html-model" com.shabakaty.cinemana.htmlbridge.model.CommandReservationStoreTest
          java -ea -cp "$RUNNER_TEMP/cp-html-model" com.shabakaty.cinemana.htmlbridge.model.CommandReservationProcessTest
          java -ea -cp "$RUNNER_TEMP/cp-html-model" com.shabakaty.cinemana.htmlbridge.model.FreshEpochReadTest
          java -ea -cp "$RUNNER_TEMP/cp-html-model" com.shabakaty.cinemana.htmlbridge.model.OwnerAdmissionPreflightTest
          java -ea -cp "$RUNNER_TEMP/cp-html-model" com.shabakaty.cinemana.htmlbridge.model.OwnerPageReadTest
      - name: Locate exact resume candidate callers (static only)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needle = 'Lcom/shabakaty/downloader/ey0;->l(Lcom/shabakaty/downloader/ey0;I)V'
          count = 0
          for path in Path('Cinemana_PATCH252_Project/app').rglob('*.smali'):
              method = ''
              for n,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                  if line.startswith('.method '): method = line
                  if needle in line and line.lstrip().startswith('invoke-'):
                      print(f'{path}:{n}: {method}')
                      count += 1
                  if line == '.end method': method = ''
          print(f'CP_STATIC_RESUME_CALLERS={count}')
          PY
      - name: Locate native proof and pause retry callers (static only)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needles = ('Lcom/shabakaty/downloader/ey0;->d(I)V','Lcom/shabakaty/downloader/ey0;->i(I)V')
          for path in Path('Cinemana_PATCH252_Project/app').rglob('*.smali'):
              method = ''
              for n,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                  if line.startswith('.method '): method = line
                  if ('mkv-proofs' in line and 'const-string' in line) or (any(x in line for x in needles) and line.lstrip().startswith('invoke-')):
                      print(f'{path}:{n}: {method}')
                  if line == '.end method': method = ''
          for path in Path('patches').rglob('*.java'):
              for n,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                  if 'mkv-proofs' in line: print(f'{path}:{n}: proof literal')
          PY

      - name: Trace exact epoch and queue callers (static only)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          needles = ('Fresh121;->begin(', 'Fresh121;->epoch(', 'Restart108;->admitted(', 'CnmDownloadQueue;->enqueue(')
          for path in Path('Cinemana_PATCH252_Project/app').rglob('*.smali'):
              method = ''
              for n,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                  if line.startswith('.method '): method = line
                  if line.lstrip().startswith('invoke-') and any(x in line for x in needles):
                      print(f'{path}:{n}: {method}: {line.strip()}')
                  if line == '.end method': method = ''
          PY
