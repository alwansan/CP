name: Compile recovered Android Media3 Gradle bridge

on:
  workflow_dispatch:
  push:
    branches: [experiment/rea-source-recovery]
    paths:
      - 'recovery/modernized/**'
      - '.github/workflows/rea-android-bridge.yml'

permissions:
  contents: read

jobs:
  android-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build core Java and Android library using public Media3
        working-directory: recovery/modernized
        run: |
          set -euo pipefail
          gradle --no-daemon :core-video:check :core-json-gson:check :android-bridge:assembleDebug :legacy-native:assembleDebug :android-smoke:assembleDebug --stacktrace
          test -s android-bridge/build/outputs/aar/android-bridge-debug.aar
          test -s legacy-native/build/outputs/aar/legacy-native-debug.aar
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path("../../Cinemana_PATCH252_Project/app/lib")
          aar = Path("legacy-native/build/outputs/aar/legacy-native-debug.aar")
          with ZipFile(aar) as z:
              packed = {x for x in z.namelist() if x.startswith("jni/") and x.endswith(".so")}
              expected = {"jni/" + p.relative_to(root).as_posix() for p in root.glob("*/*.so")}
              assert packed == expected, {"missing":sorted(expected - packed), "unexpected":sorted(packed - expected)}
              print("Native shared libraries preserved in AAR:",len(packed))
              for abi in sorted({name.split("/")[1] for name in packed}):
                  print("ABI",abi,"=>",sum(name.startswith("jni/"+abi+"/") for name in packed),"files")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-android-modules-aars
          if-no-files-found: error
          retention-days: 14
          path: |
            recovery/modernized/android-bridge/build/outputs/aar/android-bridge-debug.aar
            recovery/modernized/legacy-native/build/outputs/aar/legacy-native-debug.aar
