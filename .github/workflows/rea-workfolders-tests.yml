name: Verify WorkFolders104 Java reconstruction

on:
  workflow_dispatch:
  push:
    branches: [experiment/rea-source-recovery]
    paths:
      - 'recovery/tests/workfolders/**'
      - 'recovery/generated/java/com/shabakaty/cinemana/ca1/WorkFolders104.java'
      - '.github/workflows/rea-workfolders-tests.yml'

permissions:
  contents: read

jobs:
  workfolders:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile reconstructed original Java with simulated interfaces
        run: |
          set -euo pipefail
          bash recovery/tests/workfolders/test.sh
