name: CP Native Compose original resource coexistence probe
on:
  push:
    branches: [Native-Compose]
    paths: ['patches/native-compose-resource-coexistence/**', '.github/workflows/native-compose-resource-coexistence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.ref == 'refs/heads/Native-Compose'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0 platforms;android-35'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Resource dump parity unit tests
        run: python3 patches/native-compose-resource-coexistence/test_resource_coexistence.py
      - name: Generate isolated allocated lab resources
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CINEMANA_KEYSTORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.CINEMANA_KEY_PASSWORD || secrets.CINEMANA_KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ vars.CINEMANA_KEY_ALIAS || 'androiddebugkey' }}
        run: bash patches/native-compose-minified-combined/run-probe.sh
      - name: Rebuild resource-only original baseline and candidate
        run: bash patches/native-compose-resource-coexistence/run-probe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CP-Original-Resource-Coexistence-Report
          path: |
            ${{ runner.temp }}/cp-resource-coexistence/report
            ${{ runner.temp }}/cp-resource-coexistence/verify.log
          if-no-files-found: warn
