name: Rust Core (Experimental)
on:
  push:
    branches: [experiment/rust-core-migration]
    paths:
      - 'rust-core/**'
      - '.github/workflows/rust-core-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check format
        run: cargo fmt --manifest-path rust-core/Cargo.toml -- --check
      - name: Static lint
        run: cargo clippy --manifest-path rust-core/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path rust-core/Cargo.toml --all-targets
      - name: Host library build (not APK)
        run: cargo build --manifest-path rust-core/Cargo.toml --release
