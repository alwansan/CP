name: Rust Core (Experimental)
on:
  push:
    branches: [experiment/rust-core-migration]
    paths:
      - 'rust-core/**'
      - '.github/workflows/rust-core-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check format
        run: cargo fmt --manifest-path rust-core/Cargo.toml -- --check
      - name: Static lint
        run: cargo clippy --manifest-path rust-core/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path rust-core/Cargo.toml --all-targets
      - name: Host library build (not APK)
        run: cargo build --manifest-path rust-core/Cargo.toml --release
      - name: Build Android ARM64 native library
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ]; then
            SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
            [ -n "$SDK_ROOT" ] && [ -d "$SDK_ROOT/ndk" ]
            NDK="$(find "$SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          fi
          LINKER="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          test -x "$LINKER"
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$LINKER" cargo build --manifest-path rust-core/Cargo.toml --release --target aarch64-linux-android
          test -s rust-core/target/aarch64-linux-android/release/libcp_rust_core.so
      - name: Archive Android ARM64 experimental .so (not APK)
        uses: actions/upload-artifact@v4
        with:
          name: cp-rust-core-arm64-experimental
          path: rust-core/target/aarch64-linux-android/release/libcp_rust_core.so
          if-no-files-found: error
          retention-days: 14
