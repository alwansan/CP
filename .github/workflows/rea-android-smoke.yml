name: Source-first Android smoke APK (not Cinemana production)

on:
  workflow_dispatch:
  push:
    branches: [experiment/rea-source-recovery]
    paths:
      - 'recovery/modernized/legacy-resources/**'
      - 'recovery/scripts/prepare_legacy_resources.py'
      - 'recovery/modernized/android-smoke/**'
      - 'recovery/modernized/core-downloads/**'
      - 'recovery/modernized/core-search/**'
      - '.github/workflows/rea-android-smoke.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build standalone source-first smoke APK
        working-directory: recovery/modernized
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :core-video:check :core-downloads:check :core-search:check :android-smoke:assembleDebug --stacktrace
          apk=android-smoke/build/outputs/apk/debug/android-smoke-debug.apk
          test -s "$apk"
          test "$(unzip -Z1 "$apk" | grep -Ec '^lib/.*[.]so$')" -eq 49
          unzip -Z1 "$apk" | grep -q '^assets/ffmpeg$'
          unzip -Z1 "$apk" | grep -q '^resources[.]arsc$'
          unzip -Z1 "$apk" | grep -Eq '^classes([0-9]+)?[.]dex$'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "^package: name='com.shabakaty.cinemana.recovery.smoke'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          echo "Android smoke APK: package verification PASS; this is not Cinemana."
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-smoke-apk-not-cinemana
          retention-days: 14
          if-no-files-found: error
          path: recovery/modernized/android-smoke/build/outputs/apk/debug/android-smoke-debug.apk
