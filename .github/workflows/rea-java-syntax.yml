name: JDK syntax audit of reconstructed Java

on:
  workflow_dispatch:
  push:
    branches: [experiment/rea-source-recovery]
    paths:
      - 'recovery/scripts/SourceSyntaxCheck.java'
      - 'recovery/generated/java/**'
      - '.github/workflows/rea-java-syntax.yml'

concurrency:
  group: rea-java-syntax-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Parse all staged Java without resolving dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/syntax"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/syntax" recovery/scripts/SourceSyntaxCheck.java
          java -Xmx3g -cp "$RUNNER_TEMP/syntax" SourceSyntaxCheck recovery/generated/java | tee "$RUNNER_TEMP/syntax-report.txt"
          grep '^SYNTAX_SUMMARY ' "$RUNNER_TEMP/syntax-report.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: source-java-syntax-audit
          retention-days: 14
          path: |
            \${{ runner.temp }}/syntax-report.txt
