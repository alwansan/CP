name: Build and Sign Cinemana PATCH252 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/high10-subtitle-refresh
      - diagnostics/high10-player-trace
      - fix/high10-preserve-surface
      - feature/subtitle-sync-live-refresh
      - fix/external-subtitle-sync-ui
      - fix/sequential-sync-dialog-zero
      - fix/download-mkv-self-repair
      - fix/download-mkv-disk-recovery
      - fix/recovery-journal-autostart
    paths:
      - "Cinemana_PATCH252_Project/**"
      - "signing/checkpoint145-debug.keystore"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: cinemana-patch252-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sign-release:
    name: Build, sign, and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK Build Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;35.0.0"

      - name: Validate project and signing inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f Cinemana_PATCH252_Project/app/apktool.yml
          test -f Cinemana_PATCH252_Project/tools/apktool_2.12.1.jar
          test -f Cinemana_PATCH252_Project/tools/framework/1.apk
          test -f signing/checkpoint145-debug.keystore
          test -x /usr/bin/unzip
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          java -version
          du -sh Cinemana_PATCH252_Project
          ls -lh signing/checkpoint145-debug.keystore

      - name: Verify stable playback, subtitle sync, and UI fix wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'H26410SoftwareRenderer;->markSubtitleRefresh()V' Cinemana_PATCH252_Project/app/smali/com/shabakaty/downloader/y10.smali
          grep -q 'H26410SoftwareRenderer;->shouldUseSoftware(Lcom/shabakaty/downloader/wh1;)Z' Cinemana_PATCH252_Project/app/smali/com/shabakaty/downloader/so2.smali
          grep -q 'H26410SoftwareRenderer;->resolveRefreshFormat(Lcom/shabakaty/downloader/wh1;)Lcom/shabakaty/downloader/wh1;' Cinemana_PATCH252_Project/app/smali_classes10/com/shabakaty/cinemana/player/H26410SoftwareRenderer.smali
          grep -q 'renderer_surface_snapshot' Cinemana_PATCH252_Project/app/smali_classes10/com/shabakaty/cinemana/player/H26410SoftwareRenderer.smali
          grep -q 'diagnosticLogRendererStates()V' Cinemana_PATCH252_Project/app/smali/com/shabakaty/downloader/s64.smali
          grep -q 'media_refresh_item_uri' Cinemana_PATCH252_Project/app/smali/com/shabakaty/downloader/s64.smali
          grep -q 'player_error_exception' Cinemana_PATCH252_Project/app/smali/com/shabakaty/downloader/wc3.smali
          grep -q 'render_skip_surface_null_persisting' Cinemana_PATCH252_Project/app/smali_classes10/com/shabakaty/cinemana/player/H26410SoftwareRenderer.smali
          grep -q 'renderer_surface_retained_by_B_cleanup' Cinemana_PATCH252_Project/app/smali_classes10/com/shabakaty/cinemana/player/H26410SoftwareRenderer.smali
          ! grep -q 'renderer_surface_cleared_by_B_cleanup' Cinemana_PATCH252_Project/app/smali_classes10/com/shabakaty/cinemana/player/H26410SoftwareRenderer.smali
          grep -q 'subtitle_sync_force_refresh_done' Cinemana_PATCH252_Project/app/smali/com/shabakaty/downloader/bm4.smali
          grep -q 'addHalfSecondButtons' Cinemana_PATCH252_Project/app/smali_classes2/com/shabakaty/cinemana/mod/SubtitleSyncHelper.smali
          grep -q 'addZeroButton' Cinemana_PATCH252_Project/app/smali_classes2/com/shabakaty/cinemana/mod/SubtitleSyncHelper.smali
          grep -q 'const v0, 0x7fffffff' Cinemana_PATCH252_Project/app/smali_classes2/com/shabakaty/cinemana/mod/SubtitleSyncHelper.smali
          grep -q '0.5s' Cinemana_PATCH252_Project/app/smali_classes2/com/shabakaty/cinemana/mod/SubtitleSyncHelper.smali
          grep -q 'addHalfSecondButtons' Cinemana_PATCH252_Project/app/smali_classes9/com/shabakaty/cinemana/mod/SequentialSubtitleSyncHelper.smali
          grep -q 'addZeroButton' Cinemana_PATCH252_Project/app/smali_classes9/com/shabakaty/cinemana/mod/SequentialSubtitleSyncHelper.smali
          grep -q 'invoke-static {v9, v13, v4}, Lcom/shabakaty/cinemana/mod/SequentialSubtitleSyncHelper;->addHalfSecondButtons' Cinemana_PATCH252_Project/app/smali_classes9/com/shabakaty/cinemana/mod/SequentialSubtitleSyncHelper.smali
          ! grep -q 'invoke-static {v9, v3, v4}, Lcom/shabakaty/cinemana/mod/SequentialSubtitleSyncHelper;->addHalfSecondButtons' Cinemana_PATCH252_Project/app/smali_classes9/com/shabakaty/cinemana/mod/SequentialSubtitleSyncHelper.smali
          grep -q 'const v0, 0x7fffffff' Cinemana_PATCH252_Project/app/smali_classes9/com/shabakaty/cinemana/mod/SequentialSubtitleSyncHelper\$2.smali
          grep -q '0.5s' Cinemana_PATCH252_Project/app/smali_classes9/com/shabakaty/cinemana/mod/SequentialSubtitleSyncHelper.smali
          grep -q 'check-cast p0, Landroid/widget/Button;' Cinemana_PATCH252_Project/app/smali_classes9/com/shabakaty/cinemana/features/SequentialSubtitleManager.smali
          grep -q 'showSequentialDialog(Ljava/lang/Object;)V' Cinemana_PATCH252_Project/app/smali_classes9/com/shabakaty/cinemana/features/SequentialSubtitleManager.smali
          grep -q 'styleDialogButtons(Ljava/lang/Object;Ljava/lang/Object;)V' Cinemana_PATCH252_Project/app/smali_classes9/com/shabakaty/cinemana/features/SequentialSubtitleManager.smali
          grep -q 'const/4 v0, -0x1' Cinemana_PATCH252_Project/app/smali_classes9/com/shabakaty/cinemana/features/SequentialSubtitleManager.smali
          grep -q 'device_build_fingerprint' Cinemana_PATCH252_Project/app/smali/com/shabakaty/cinemana/player/PlayerDiagnosticLog.smali
          grep -q '.method public toString()Ljava/lang/String;' Cinemana_PATCH252_Project/app/smali/com/shabakaty/cinemana/domain/models/local/VideoModel.smali
          grep -q 'DownloadRepair129;->profile(Landroid/view/View;)V' Cinemana_PATCH252_Project/app/smali_classes6/com/shabakaty/cinemana/ca1/Enhancements.smali
          grep -q 'ca1_download_repair129' Cinemana_PATCH252_Project/app/res/layout/fragment_profile.xml
          grep -q 'ca1_download_repair129' Cinemana_PATCH252_Project/app/res/layout-v22/fragment_profile.xml
          grep -q 'download_repair_findings.log' Cinemana_PATCH252_Project/app/smali_classes6/com/shabakaty/cinemana/ca1/DownloadRepair129.smali
          grep -q 'cond_task_verified129' Cinemana_PATCH252_Project/app/smali_classes6/com/shabakaty/cinemana/ca1/Restart108.smali
          grep -q 'cnm_repair_journal_v1' Cinemana_PATCH252_Project/app/smali_classes6/com/shabakaty/cinemana/ca1/RepairJournal129.smali
          grep -q 'RepairJournal129;->scheduleAuto' Cinemana_PATCH252_Project/app/smali_classes6/com/shabakaty/cinemana/ca1/Restart108.smali
          grep -q 'RepairJournal129;->record' Cinemana_PATCH252_Project/app/smali_classes6/com/shabakaty/cinemana/ca1/DownloadRepair129.smali
          grep -q 'RepairJournal129;->complete' Cinemana_PATCH252_Project/app/smali_classes3/com/shabakaty/cinemana/features/MkvExporter.smali
          grep -q 'recoverExpectedFromDependencyPlan' Cinemana_PATCH252_Project/app/smali_classes3/com/shabakaty/cinemana/features/MkvManifestStore.smali

          grep -q 'reconcileDiskReady(Landroid/content/Context;Ljava/io/File;)Z' Cinemana_PATCH252_Project/app/smali_classes3/com/shabakaty/cinemana/features/MkvManifestStore.smali
          grep -q 'MP4_DISK_READY_FOR_MKV' Cinemana_PATCH252_Project/app/smali_classes6/com/shabakaty/cinemana/ca1/DownloadRepair129.smali
          grep -q 'repairDiskMp4(Landroid/content/Context;)V' Cinemana_PATCH252_Project/app/smali_classes6/com/shabakaty/cinemana/ca1/DownloadRepair129.smali
          echo "Stable playback, subtitle sync, and UI fix wiring: PASS"
          echo "Download/MKV repair wiring: PASS"

      - name: Build unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x Cinemana_PATCH252_Project/build.sh
          ./Cinemana_PATCH252_Project/build.sh

      - name: Align and sign APK
        id: sign
        shell: bash
        env:
          # If the keystore uses non-default credentials, define these in
          # GitHub repository Settings > Secrets and variables > Actions.
          KEYSTORE_PASSWORD: ${{ secrets.CINEMANA_KEYSTORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.CINEMANA_KEY_PASSWORD || secrets.CINEMANA_KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ vars.CINEMANA_KEY_ALIAS || 'androiddebugkey' }}
        run: |
          set -euo pipefail
          TOOL_DIR="$ANDROID_HOME/build-tools/35.0.0"
          KEYSTORE="signing/checkpoint145-debug.keystore"
          UNSIGNED="Cinemana_PATCH252_Project/output/Cinemana_PATCH252_unsigned.apk"
          ALIGNED="Cinemana_PATCH252_Project/output/Cinemana_PATCH252_aligned.apk"
          if [[ "$GITHUB_REF_NAME" == "fix/download-mkv-disk-recovery" ]]; then
            SIGNED_NAME="Cinemana_PATCH259_MkvDiskRecovery_signed.apk"
            TAG_SUFFIX="mkv-disk-recovery"
            DISPLAY_NAME="Disk MKV Recovery"
            PATCH_VERSION="259"
          elif [[ "$GITHUB_REF_NAME" == "fix/download-mkv-self-repair" ]]; then
            SIGNED_NAME="Cinemana_PATCH258_DownloadRepair_signed.apk"
            TAG_SUFFIX="download-repair"
            DISPLAY_NAME="Download Repair"
            PATCH_VERSION="258"
          else
            SIGNED_NAME="Cinemana_PATCH257_SubtitleSyncDialogZero_signed.apk"
            TAG_SUFFIX="sequential-sync-zero"
            DISPLAY_NAME="Subtitle Sync Dialog & Zero"
            PATCH_VERSION="257"
          fi
          SIGNED="Cinemana_PATCH252_Project/output/$SIGNED_NAME"

          keytool -list -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" >/dev/null
          "$TOOL_DIR/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$TOOL_DIR/zipalign" -c -p 4 "$ALIGNED"
          "$TOOL_DIR/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"
          "$TOOL_DIR/apksigner" verify --verbose --print-certs "$SIGNED"
          unzip -t "$SIGNED"
          sha256sum "$SIGNED" | tee Cinemana_PATCH252_Project/output/SHA256SUMS.txt
          ls -lh "$SIGNED"
          echo "signed_name=$SIGNED_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_suffix=$TAG_SUFFIX" >> "$GITHUB_OUTPUT"
          echo "display_name=$DISPLAY_NAME" >> "$GITHUB_OUTPUT"
          echo "patch_version=$PATCH_VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish signed APK as a direct GitHub Release download
        uses: softprops/action-gh-release@v3
        with:
          tag_name: PATCH${{ steps.sign.outputs.patch_version }}-${{ steps.sign.outputs.tag_suffix }}-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Cinemana PATCH${{ steps.sign.outputs.patch_version }} ${{ steps.sign.outputs.display_name }} #${{ github.run_number }}"
          body: |
            Build for branch ${{ github.ref_name }}.
            ${{ github.ref_name == 'fix/download-mkv-disk-recovery' && 'Adds a bounded disk scan of existing MP4 files in Cinemana/work, verifies subtitle inputs against the saved manifest plan, reconstructs stale aggregate readiness only when the exact plan is present, and nudges the existing guarded MKV exporter. Existing MKV files are skipped; missing/unknown subtitle plans are logged as unresolved.' || github.ref_name == 'fix/download-mkv-self-repair' && 'Adds a guarded manual download/MKV recovery pass, separate repair logs, and fixes stale zero-task recovery after path and size verification. It does not blindly duplicate terminal downloads or delete source files.' || 'Fixes the sequential subtitle sync dialog and adds zero-offset reset buttons while preserving existing playback and subtitle behavior.' }}
            Automated assembly, alignment, signing, and signature verification completed.
            Source commit: ${{ github.sha }}.
            The APK is signed with signing/checkpoint145-debug.keystore.
          files: |
            Cinemana_PATCH252_Project/output/${{ steps.sign.outputs.signed_name }}
            Cinemana_PATCH252_Project/output/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
