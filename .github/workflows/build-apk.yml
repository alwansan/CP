name: Build and Sign Cinemana PATCH254 Decoder Mode

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/high10-subtitle-refresh
    paths:
      - "Cinemana_PATCH252_Project/**"
      - "signing/checkpoint145-debug.keystore"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: cinemana-patch252-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sign-release:
    name: Build, sign, and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK Build Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;35.0.0"

      - name: Validate project and signing inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f Cinemana_PATCH252_Project/app/apktool.yml
          test -f Cinemana_PATCH252_Project/tools/apktool_2.12.1.jar
          test -f Cinemana_PATCH252_Project/tools/framework/1.apk
          test -f signing/checkpoint145-debug.keystore
          test -x /usr/bin/unzip
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          java -version
          du -sh Cinemana_PATCH252_Project
          ls -lh signing/checkpoint145-debug.keystore

      - name: Verify FFmpeg-first decoder mode wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'CinemanaDecoderMode;->initialize(Landroid/content/Context;)V' Cinemana_PATCH252_Project/app/smali/com/shabakaty/downloader/to0.smali
          grep -q 'CinemanaDecoderMode;->isFfmpegEnabled()Z' Cinemana_PATCH252_Project/app/smali/com/shabakaty/downloader/to0.smali
          grep -q 'codecNameForMimeType(Ljava/lang/String;)Ljava/lang/String;' Cinemana_PATCH252_Project/app/smali_classes10/io/github/anilbeesetti/nextlib/media3ext/ffdecoder/FfmpegVideoDecoder.smali
          grep -q 'FfmpegLibrary;->isDecoderAvailable(Ljava/lang/String;)Z' Cinemana_PATCH252_Project/app/smali_classes10/io/github/anilbeesetti/nextlib/media3ext/ffdecoder/FfmpegVideoDecoder.smali
          grep -q 'CinemanaDecoderMode;->setMode(Landroid/content/Context;I)V' Cinemana_PATCH252_Project/app/smali_classes6/com/shabakaty/cinemana/ca1/Settings94\$DecoderModeClick.smali
          grep -q 'ca1_decoder_mode' Cinemana_PATCH252_Project/app/res/layout/fragment_settings_list.xml
          grep -q 'ca1_decoder_mode' Cinemana_PATCH252_Project/app/res/layout-v22/fragment_settings_list.xml
          grep -q 'shouldUseSoftware(Lcom/shabakaty/downloader/wh1;)Z' Cinemana_PATCH252_Project/app/smali_classes10/com/shabakaty/cinemana/player/H26410SoftwareRenderer.smali
          test -f Cinemana_PATCH252_Project/app/smali/com/shabakaty/cinemana/player/CinemanaDecoderMode.smali
          test -f 'Cinemana_PATCH252_Project/app/smali_classes6/com/shabakaty/cinemana/ca1/Settings94$DecoderModeClick.smali'
          test -f 'Cinemana_PATCH252_Project/app/smali_classes6/com/shabakaty/cinemana/ca1/Settings94$$ExternalSyntheticLambda3.smali'
          echo "FFmpeg-first decoder mode wiring: PASS"

      - name: Build unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x Cinemana_PATCH252_Project/build.sh
          ./Cinemana_PATCH252_Project/build.sh

      - name: Align and sign APK
        shell: bash
        env:
          # If the keystore uses non-default credentials, define these in
          # GitHub repository Settings > Secrets and variables > Actions.
          KEYSTORE_PASSWORD: ${{ secrets.CINEMANA_KEYSTORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.CINEMANA_KEY_PASSWORD || secrets.CINEMANA_KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ vars.CINEMANA_KEY_ALIAS || 'androiddebugkey' }}
        run: |
          set -euo pipefail
          TOOL_DIR="$ANDROID_HOME/build-tools/35.0.0"
          KEYSTORE="signing/checkpoint145-debug.keystore"
          UNSIGNED="Cinemana_PATCH252_Project/output/Cinemana_PATCH252_unsigned.apk"
          ALIGNED="Cinemana_PATCH252_Project/output/Cinemana_PATCH252_aligned.apk"
          SIGNED="Cinemana_PATCH252_Project/output/Cinemana_PATCH254_FFmpegDefault_signed.apk"

          keytool -list -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" >/dev/null
          "$TOOL_DIR/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$TOOL_DIR/zipalign" -c -p 4 "$ALIGNED"
          "$TOOL_DIR/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"
          "$TOOL_DIR/apksigner" verify --verbose --print-certs "$SIGNED"
          unzip -t "$SIGNED"
          sha256sum "$SIGNED" | tee Cinemana_PATCH252_Project/output/SHA256SUMS.txt
          ls -lh "$SIGNED"

      - name: Publish signed APK as a direct GitHub Release download
        uses: softprops/action-gh-release@v3
        with:
          tag_name: PATCH254-decoder-mode-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Cinemana PATCH254 FFmpeg default decoder #${{ github.run_number }}"
          body: |
            PATCH254 FFmpeg-first video decoder mode.
            FFmpeg is preferred for clear video formats supported by the bundled native library.
            MediaCodec remains available for DRM-protected and FFmpeg-unsupported formats.
            The original MediaCodec-only mode is selectable in app settings.
            Source commit: ${{ github.sha }}.
            The APK is signed with signing/checkpoint145-debug.keystore.
          files: |
            Cinemana_PATCH252_Project/output/Cinemana_PATCH254_FFmpegDefault_signed.apk
            Cinemana_PATCH252_Project/output/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          make_latest: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
