name: Build Cinemana PATCH252 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Cinemana_PATCH252_Project/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

concurrency:
  group: cinemana-patch252-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Assemble APKTool project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate project inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f Cinemana_PATCH252_Project/app/apktool.yml
          test -f Cinemana_PATCH252_Project/tools/apktool_2.12.1.jar
          test -f Cinemana_PATCH252_Project/tools/framework/1.apk
          test -x /usr/bin/unzip
          java -version
          du -sh Cinemana_PATCH252_Project

      - name: Build unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x Cinemana_PATCH252_Project/build.sh
          ./Cinemana_PATCH252_Project/build.sh

      - name: Verify APK archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="Cinemana_PATCH252_Project/output/Cinemana_PATCH252_unsigned.apk"
          test -s "$APK"
          unzip -t "$APK"
          sha256sum "$APK" | tee Cinemana_PATCH252_Project/output/SHA256SUMS.txt
          ls -lh "$APK"

      - name: Publish APK as a direct GitHub Release download
        uses: softprops/action-gh-release@v3
        with:
          tag_name: PATCH252-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Cinemana PATCH252 build #${{ github.run_number }}
          body: |
            Automated APKTool build from commit ${{ github.sha }}.

            The APK is unsigned. Sign it with your own key before installing.
          files: |
            Cinemana_PATCH252_Project/output/Cinemana_PATCH252_unsigned.apk
            Cinemana_PATCH252_Project/output/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: "true"
