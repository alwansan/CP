name: CP HTML navigation lab
on:
  push:
    branches: [Html]
    paths:
      - 'docs/fixtures/html-nav-lab/**'
      - '.github/workflows/html-nav-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cp-html-nav-lab-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-lab:
    if: github.ref == 'refs/heads/Html'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: docs/fixtures/html-nav-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Model and syntax checks
        run: |
          node --check navigation-model.js
          node --check test-navigation.cjs
          node --check test-browser.cjs
          node test-navigation.cjs
      - name: Install pinned browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Chromium regression
        run: node test-browser.cjs
