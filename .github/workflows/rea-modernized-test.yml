name: Test modernized Java modules (separate from APK)

on:
  workflow_dispatch:
  push:
    branches: [experiment/rea-source-recovery]
    paths:
      - 'recovery/modernized/**'
      - 'recovery/scripts/verify_original_room_schema.py'
      - 'recovery/scripts/verify_original_room_database_names.py'
      - 'recovery/scripts/verify_original_room_migration_graph.py'
      - 'recovery/scripts/verify_original_room_json_projection.py'
      - 'recovery/scripts/verify_original_room_json_sql_guard.py'
      - 'recovery/scripts/test_original_room_migration_sql.py'
      - 'recovery/scripts/test_original_room_3_to_4.py'
      - 'recovery/scripts/test_original_room_2_to_3_sql.py'
      - '.github/workflows/rea-modernized-test.yml'

permissions:
  contents: read

jobs:
  core-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify original Room schema SQL and composite key match Smali
        shell: bash
        run: python3 recovery/scripts/verify_original_room_schema.py
      - name: Verify Dagger-provided original Room database file naming
        shell: bash
        run: python3 recovery/scripts/verify_original_room_database_names.py
      - name: Check original Room migration version graph without touching user data
        shell: bash
        run: python3 recovery/scripts/verify_original_room_migration_graph.py
      - name: Guard original Room JSON projection field and Kotlin operation parity
        shell: bash
        run: python3 recovery/scripts/verify_original_room_json_projection.py
      - name: Verify exact original 2-to-3 SQLite create/copy SQL and guarded Android identity
        shell: bash
        run: python3 recovery/scripts/verify_original_room_json_sql_guard.py
      - name: Run original Room migration SQL in disposable in-memory SQLite
        shell: bash
        run: python3 recovery/scripts/test_original_room_migration_sql.py
      - name: Test SQL-only 2-to-3 Room copy and rollback
        shell: bash
        run: python3 recovery/scripts/test_original_room_2_to_3_sql.py
      - name: Test 3-to-4 Room remaps on synthetic, disposable SQLite
        shell: bash
        run: python3 recovery/scripts/test_original_room_3_to_4.py
      - name: Compile and test recovered Downloads identity resolver with JDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/modernized/build/test-downloads
          javac -encoding UTF-8 -d recovery/modernized/build/test-downloads \
            recovery/modernized/core-downloads/src/main/java/com/shabakaty/cinemana/recovery/downloads/LegacyDownloadIdentityResolver.java \
            recovery/modernized/core-downloads/src/test/java/com/shabakaty/cinemana/recovery/downloads/LegacyDownloadIdentityResolverTest.java
          java -cp recovery/modernized/build/test-downloads \
            com.shabakaty.cinemana.recovery.downloads.LegacyDownloadIdentityResolverTest
      - name: Compile and test recovered Room 2-to-3 series JSON projection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/modernized/build/test-room-episode
          javac -encoding UTF-8 -d recovery/modernized/build/test-room-episode \
            recovery/modernized/core-downloads/src/main/java/com/shabakaty/cinemana/recovery/downloads/LegacyRoomV2EpisodeMetadata.java \
            recovery/modernized/core-downloads/src/test/java/com/shabakaty/cinemana/recovery/downloads/LegacyRoomV2EpisodeMetadataTest.java
          java -cp recovery/modernized/build/test-room-episode \
            com.shabakaty.cinemana.recovery.downloads.LegacyRoomV2EpisodeMetadataTest
      - name: Verify Room 2-to-3 copied row identity guard (JDK)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/modernized/build/test-room-guard
          javac -encoding UTF-8 -d recovery/modernized/build/test-room-guard \
            recovery/modernized/core-downloads/src/main/java/com/shabakaty/cinemana/recovery/downloads/LegacyRoomV2EpisodeMetadata.java \
            recovery/modernized/core-downloads/src/main/java/com/shabakaty/cinemana/recovery/downloads/LegacyRoomV2RowWriteGuard.java \
            recovery/modernized/core-downloads/src/test/java/com/shabakaty/cinemana/recovery/downloads/LegacyRoomV2RowWriteGuardTest.java
          java -cp recovery/modernized/build/test-room-guard \
            com.shabakaty.cinemana.recovery.downloads.LegacyRoomV2RowWriteGuardTest
      - name: Verify Room 2-to-3 collection planner (JDK)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/modernized/build/test-room-collections
          javac -encoding UTF-8 -d recovery/modernized/build/test-room-collections \
            recovery/modernized/core-downloads/src/main/java/com/shabakaty/cinemana/recovery/downloads/LegacyRoomV2EpisodeMetadata.java \
            recovery/modernized/core-downloads/src/main/java/com/shabakaty/cinemana/recovery/downloads/LegacyRoomV2CollectionPlanner.java \
            recovery/modernized/core-downloads/src/test/java/com/shabakaty/cinemana/recovery/downloads/LegacyRoomV2CollectionPlannerTest.java
          java -cp recovery/modernized/build/test-room-collections \
            com.shabakaty.cinemana.recovery.downloads.LegacyRoomV2CollectionPlannerTest
      - name: Compile and test clean High10 Java module
        shell: bash
        run: |
          set -euo pipefail
          bash recovery/modernized/test-core-video.sh
          test -f recovery/modernized/build/test-classes/com/shabakaty/cinemana/player/H264High10Detector.class
