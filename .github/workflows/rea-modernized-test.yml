name: Test modernized Java modules (separate from APK)

on:
  workflow_dispatch:
  push:
    branches: [experiment/rea-source-recovery]
    paths:
      - 'recovery/modernized/**'
      - 'recovery/scripts/verify_original_room_schema.py'
      - 'recovery/scripts/verify_original_room_database_names.py'
      - 'recovery/scripts/verify_original_room_migration_graph.py'
      - '.github/workflows/rea-modernized-test.yml'

permissions:
  contents: read

jobs:
  core-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify original Room schema SQL and composite key match Smali
        shell: bash
        run: python3 recovery/scripts/verify_original_room_schema.py
      - name: Verify Dagger-provided original Room database file naming
        shell: bash
        run: python3 recovery/scripts/verify_original_room_database_names.py
      - name: Check original Room migration version graph without touching user data
        shell: bash
        run: python3 recovery/scripts/verify_original_room_migration_graph.py
      - name: Compile and test recovered Downloads identity resolver with JDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/modernized/build/test-downloads
          javac -encoding UTF-8 -d recovery/modernized/build/test-downloads \
            recovery/modernized/core-downloads/src/main/java/com/shabakaty/cinemana/recovery/downloads/LegacyDownloadIdentityResolver.java \
            recovery/modernized/core-downloads/src/test/java/com/shabakaty/cinemana/recovery/downloads/LegacyDownloadIdentityResolverTest.java
          java -cp recovery/modernized/build/test-downloads \
            com.shabakaty.cinemana.recovery.downloads.LegacyDownloadIdentityResolverTest
      - name: Compile and test clean High10 Java module
        shell: bash
        run: |
          set -euo pipefail
          bash recovery/modernized/test-core-video.sh
          test -f recovery/modernized/build/test-classes/com/shabakaty/cinemana/player/H264High10Detector.class
