name: CP-DL signed download stability APK
on:
  workflow_dispatch:
  push:
    branches: [feature/download-stability]
    paths: ['Cinemana_PATCH252_Project/**', 'patches/local-account/**', '.github/workflows/download-stability.yml', 'scripts/test_cp_dl.py', 'scripts/test_recovery_flow.py', 'scripts/verify_apk_dex.py', 'scripts/test_apk_dex.py', 'scripts/cp_dl_art/**', 'scripts/test_mux_slots_dl.py']
permissions:
  contents: write
concurrency:
  group: cp-dl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-build:
    if: github.ref == 'refs/heads/feature/download-stability'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0 platforms;android-35'
      - name: Download pinned compiler and test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local-tools"
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/robolectric/android-all/13-robolectric-9030017/android-all-13-robolectric-9030017.jar -o "$RUNNER_TEMP/local-tools/android.jar"
          curl --fail --location --retry 3 https://storage.googleapis.com/r8-releases/raw/8.3.37/r8.jar -o "$RUNNER_TEMP/local-tools/r8.jar"
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar -o "$RUNNER_TEMP/local-tools/gson.jar"
          echo '4241c14a7727c34feea6507ec801318a3d4a90f070e4525681079fb94ee4c593  '"$RUNNER_TEMP/local-tools/gson.jar" | sha256sum --check
      - name: Test account storage and API routing; compile helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 patches/local-account/run_tests.py --android-jar "$RUNNER_TEMP/local-tools/android.jar" --gson-jar "$RUNNER_TEMP/local-tools/gson.jar"
          python3 patches/local-account/build.py --android-jar "$RUNNER_TEMP/local-tools/android.jar" --r8-jar "$RUNNER_TEMP/local-tools/r8.jar"
          python3 patches/local-account/validate.py
          python3 scripts/validate_recovery.py
          python3 scripts/test_reference_guards.py
          python3 scripts/test_recovery_flow.py
          python3 scripts/test_apk_dex.py
          python3 scripts/test_cp_dl.py
          python3 scripts/test_mux_slots_dl.py
          bash Cinemana_PATCH252_Project/build.sh
      - name: Align, sign and verify test APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CINEMANA_KEYSTORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.CINEMANA_KEY_PASSWORD || secrets.CINEMANA_KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ vars.CINEMANA_KEY_ALIAS || 'androiddebugkey' }}
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -f -p 4 Cinemana_PATCH252_Project/output/Cinemana_PATCH252_unsigned.apk "$RUNNER_TEMP/local-aligned.apk"
          "$tools/apksigner" sign --ks signing/checkpoint145-debug.keystore --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out Cinemana_PATCH252_Project/output/Cinemana_CP_DL_B1b3_signed.apk "$RUNNER_TEMP/local-aligned.apk"
          "$tools/apksigner" verify --verbose Cinemana_PATCH252_Project/output/Cinemana_CP_DL_B1b3_signed.apk
          "$tools/zipalign" -c -p 4 Cinemana_PATCH252_Project/output/Cinemana_CP_DL_B1b3_signed.apk
          python3 scripts/verify_apk_dex.py Cinemana_PATCH252_Project/output/Cinemana_CP_DL_B1b3_signed.apk --smali-root Cinemana_PATCH252_Project/app
          sha256sum Cinemana_PATCH252_Project/output/Cinemana_CP_DL_B1b3_signed.apk > Cinemana_PATCH252_Project/output/CP_DL_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Cinemana-CP-DL-B1b3
          path: |
            Cinemana_PATCH252_Project/output/Cinemana_CP_DL_B1b3_signed.apk
            Cinemana_PATCH252_Project/output/CP_DL_SHA256SUMS.txt
          if-no-files-found: error

      - name: Detect emulator acceleration (ART gate still mandatory)
        id: emulator_accel
        shell: bash
        run: |
          set -euo pipefail
          opts="-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim"
          if [[ ! -c /dev/kvm ]]; then
            sudo modprobe kvm || true
            if grep -qm1 vmx /proc/cpuinfo; then sudo modprobe kvm_intel || true; fi
            if grep -qm1 svm /proc/cpuinfo; then sudo modprobe kvm_amd || true; fi
          fi
          if [[ -c /dev/kvm ]]; then
            sudo chmod a+rw /dev/kvm
          fi
          if [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]; then
            echo "KVM device accessible"
          else
            echo "KVM unavailable; use software Android emulator, do not skip ART test"
            opts="$opts -accel off"
          fi
          echo "options=$opts" >> "$GITHUB_OUTPUT"
      - name: Verify signed APK on Android 15 ART and open batch dialog
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1800
          emulator-options: ${{ steps.emulator_accel.outputs.options }}
          script: bash scripts/cp_dl_art/run.sh Cinemana_PATCH252_Project/output/Cinemana_CP_DL_B1b3_signed.apk

      - name: Publish direct APK release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: cp-dl-B1b3-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Cinemana CP-DL B1b3 #${{ github.run_number }}"
          prerelease: true
          make_latest: "false"
          body: |
            CP-DL B1b3: three shared mux slots across application processes, original per-source leases retained, bounded asynchronous completion-token discovery, and mandatory ART dialog/backend verification. JVM tests include process death; full device validation still required. Durable whole-batch admission and real UI synchronization remain pending.
            Install the APK directly as an update; preserve app data.
          files: |
            Cinemana_PATCH252_Project/output/Cinemana_CP_DL_B1b3_signed.apk
            Cinemana_PATCH252_Project/output/CP_DL_SHA256SUMS.txt
          fail_on_unmatched_files: true
