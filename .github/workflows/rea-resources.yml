name: Validate source-first Cinemana res and assets Gradle module

on:
  workflow_dispatch:
  push:
    branches: [experiment/rea-source-recovery]
    paths:
      - 'recovery/modernized/legacy-resources/**'
      - '.github/workflows/rea-resources.yml'

permissions:
  contents: read

jobs:
  resources:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile original decoded resources without changing APKTool reference
        working-directory: recovery/modernized
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :legacy-resources:assembleDebug --stacktrace
          aar=legacy-resources/build/outputs/aar/legacy-resources-debug.aar
          test -s "$aar"
          unzip -l "$aar" | grep 'assets/ffmpeg'
          unzip -l "$aar" | grep 'res/'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cinemana-original-resources-aar
          retention-days: 14
          path: recovery/modernized/legacy-resources/build/outputs/aar/legacy-resources-debug.aar
