name: CP Jetpack Compose standalone lab
on:
  push:
    branches: [Native-Compose]
    paths: ['patches/compose-lab/**', '.github/workflows/compose-lab.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cp-compose-lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lab:
    if: github.ref == 'refs/heads/Native-Compose'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0 platforms;android-35'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed Compose and test APK
        working-directory: patches/compose-lab
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CINEMANA_KEYSTORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.CINEMANA_KEY_PASSWORD || secrets.CINEMANA_KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ vars.CINEMANA_KEY_ALIAS || 'androiddebugkey' }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
          OUT="$RUNNER_TEMP/cp-compose-lab"
          mkdir -p "$OUT"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT/main.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$OUT/test.apk"
          T="$ANDROID_HOME/build-tools/35.0.0"
          "$T/apksigner" verify --verbose "$OUT/main.apk"
          "$T/apksigner" verify --verbose "$OUT/test.apk"
          "$T/aapt2" dump permissions "$OUT/main.apk" | tee "$OUT/permissions.txt"
          # AndroidX may declare its own signature-only receiver permission.
          if grep -E 'uses-permission.*(android.permission.INTERNET|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|ACCESS_NETWORK_STATE)' "$OUT/permissions.txt"; then exit 1; fi
          cp "$OUT/main.apk" "$OUT/Cinemana-Compose-Lab-0.1.apk"
          (cd "$OUT"; sha256sum Cinemana-Compose-Lab-0.1.apk > SHA256SUMS.txt)
      - name: Enable KVM
        run: |
          if [[ -c /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
      - name: Android 15 Compose smoke and synthetic pressure
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 1800
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash patches/compose-lab/run-android-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cinemana-Compose-Lab
          path: |
            ${{ runner.temp }}/cp-compose-lab/Cinemana-Compose-Lab-0.1.apk
            ${{ runner.temp }}/cp-compose-lab/SHA256SUMS.txt
            ${{ runner.temp }}/cp-compose-lab/android-test.txt
            ${{ runner.temp }}/cp-compose-lab/android-metrics.txt
            ${{ runner.temp }}/cp-compose-lab/android-runtime.txt
            ${{ runner.temp }}/cp-compose-lab/owner-fixture.txt
          if-no-files-found: error
      - uses: softprops/action-gh-release@v3
        if: success()
        with:
          tag_name: cp-compose-lab-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Cinemana Compose Lab #${{ github.run_number }}
          prerelease: true
          make_latest: "false"
          body: |
            Standalone Jetpack Compose debug preview, synthetic data, not original Cinemana or a release performance benchmark. No actual account/download/MKV/playback. Android 15 instrumentation gate required.
          files: |
            ${{ runner.temp }}/cp-compose-lab/Cinemana-Compose-Lab-0.1.apk
            ${{ runner.temp }}/cp-compose-lab/SHA256SUMS.txt
          fail_on_unmatched_files: true
