name: Audit full CL download and MKV logs
on:
  workflow_dispatch:
  push:
    branches: [feature/stable-core-ui-performance]
    paths: ['.github/workflows/download-audit.yml', 'scripts/audit_download_logs.py']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch complete CL logs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cl-logs"
          # Pin every file to one CL commit. Reading 'main' separately for
          # each large log can mix sessions if the phone syncs mid-audit.
          curl -fsSL --retry 3 https://api.github.com/repos/alwansan/CL/commits/main -o "$RUNNER_TEMP/cl-logs/commit.json"
          CL_SHA="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["sha"])' "$RUNNER_TEMP/cl-logs/commit.json")"
          echo "CL source commit: $CL_SHA"
          for file in downloads.log diagnostics.log .mkv_export.log ui95.log ui_performance.jsonl; do
            curl -fsSL --retry 3 "https://raw.githubusercontent.com/alwansan/CL/$CL_SHA/log/$file" -o "$RUNNER_TEMP/cl-logs/$file"
          done
          # These are genuinely optional: CL's current sync no longer has the
          # pending ledger, and old UI rotation files may be absent.
          for file in ui_performance.previous.jsonl; do
            if ! curl -fsSL --retry 2 "https://raw.githubusercontent.com/alwansan/CL/$CL_SHA/log/$file" -o "$RUNNER_TEMP/cl-logs/$file"; then
              rm -f "$RUNNER_TEMP/cl-logs/$file"
              echo "Optional CL file absent: log/$file"
            fi
          done
          if ! curl -fsSL --retry 2 "https://raw.githubusercontent.com/alwansan/CL/$CL_SHA/data/mkv_repair_pending.properties" -o "$RUNNER_TEMP/cl-logs/mkv_repair_pending.properties"; then
            rm -f "$RUNNER_TEMP/cl-logs/mkv_repair_pending.properties"
            echo "Optional CL pending ledger absent; do not infer it was fully recovered"
          fi
      - name: Count errors and state transitions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_download_logs.py "$RUNNER_TEMP/cl-logs" | tee "$RUNNER_TEMP/stable-core-audit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: stable-core-download-audit
          path: ${{ runner.temp }}/stable-core-audit.txt
          if-no-files-found: error
